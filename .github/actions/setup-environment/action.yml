name: "Setup Corex Environment"
description: "Configures Bun, Node.js, ripgrep, and installs dependencies with frozen lockfile"

inputs:
  bun-version:
    description: "Bun version to install"
    required: false
    default: "1.4.5"
  node-version:
    description: "Node.js version to install"
    required: false
    default: "22"
  install-ripgrep:
    description: "Whether to install ripgrep"
    required: false
    default: "true"

runs:
  using: "composite"
  steps:
    - name: Setup Bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: ${{ inputs.bun-version }}

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}

    - name: Install ripgrep (Linux)
      if: runner.os == 'Linux' && inputs.install-ripgrep == 'true'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y ripgrep

    - name: Install ripgrep (macOS)
      if: runner.os == 'macOS' && inputs.install-ripgrep == 'true'
      shell: bash
      run: brew install ripgrep

    - name: Install dependencies
      shell: bash
      run: bun install --frozen-lockfile
