name: Feature Request
description: Propose an idea or enhancement for Corex Code
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for suggesting an enhancement for Corex Code!
        Please ensure the proposed feature aligns with the project scope outlined in [ROADMAP.md](https://github.com/lahiruudayakumara/corex-code/blob/main/ROADMAP.md) and [docs/v0.1-spec.md](https://github.com/lahiruudayakumara/corex-code/blob/main/docs/v0.1-spec.md).

  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: Is your feature request related to a problem or limitation? A clear description of the challenge you are facing.
      placeholder: I encounter difficulty when trying to...
    validations:
      required: true

  - type: textarea
    id: proposed-solution
    attributes:
      label: Proposed Solution
      description: A clear and concise description of what you want to happen.
      placeholder: Describe the desired behavior or CLI interface...
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Any alternative solutions or workarounds you have considered.

  - type: textarea
    id: safety-considerations
    attributes:
      label: Safety & Boundary Implications
      description: |
        Corex Code enforces strict safety boundaries (see docs/safety.md).
        Does this feature alter permissions, trust boundaries, path safety, or tool capabilities?

  - type: textarea
    id: additional-context
    attributes:
      label: Additional Context
      description: Add any other context, mockups, or examples here.
